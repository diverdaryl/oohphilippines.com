<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OOH Field Capture</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="field-manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OOH Capture">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:#eef4fb;color:#1f2933;padding:16px;max-width:560px;margin:0 auto;}
  h1{font-size:20px;color:#0d3b66;margin-bottom:2px;}
  .sub{color:#5b6770;font-size:13px;margin-bottom:14px;line-height:1.5;}
  label{display:block;font-size:13px;font-weight:700;color:#37474f;margin:12px 0 5px;}
  input{width:100%;padding:12px 14px;border:1.5px solid #cfd8e3;border-radius:10px;font-size:16px;font-family:inherit;}
  .bigbtn{display:block;width:100%;padding:20px;border:none;border-radius:14px;font-size:19px;font-weight:800;color:#fff;margin-top:12px;font-family:inherit;cursor:pointer;}
  .cam{background:#1565c0;} .vid{background:#37474f;}
  .send{background:#2e7d32;} .send:disabled{opacity:.5;}
  .card{background:#fff;border:1px solid #e0e6ed;border-radius:12px;padding:14px;margin-top:14px;}
  .cap{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eef2f6;padding:10px 0;}
  .cap img{height:54px;width:72px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:#000;}
  .cap .meta{flex:1;font-size:12.5px;color:#455a64;line-height:1.4;min-width:0;}
  .cap .rm{background:#b71c1c;color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer;flex:0 0 auto;}
  .ok{color:#1b5e20;} .warn{color:#e65100;} .err{color:#b71c1c;}
  .muted{color:#78909c;font-size:12px;}
  .badge{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:10px 12px;font-size:13px;color:#5d4037;margin-top:12px;}
</style>
</head>
<body>
  <h1>📸 OOH Field Capture</h1>
  <p class="sub">Take the on-site photo (and video for LED). Your location &amp; time are recorded automatically. Send to your operator when you have signal — no login needed.</p>

  <label>Operator email (where to send)</label>
  <input type="email" id="opEmail" placeholder="e.g. hddigital@oohphilippines.com" autocomplete="email">

  <label>Brand / advertiser <span class="muted">(optional)</span></label>
  <input type="text" id="brand" placeholder="e.g. Executive Optical">
  <label>Site name or code <span class="muted">(optional, helps the operator)</span></label>
  <input type="text" id="siteNote" placeholder="e.g. EDSA Guadalupe NB">

  <input type="file" accept="image/*" capture="environment" id="photoIn" style="display:none;">
  <input type="file" accept="video/*" capture="environment" id="videoIn" style="display:none;">
  <button class="bigbtn cam" onclick="document.getElementById('photoIn').click()">📷 Take Photo</button>
  <button class="bigbtn vid" onclick="document.getElementById('videoIn').click()">📹 Take Video (LED)</button>

  <div id="capStatus" class="muted" style="margin-top:10px;text-align:center;"></div>

  <div class="card" id="listCard" style="display:none;">
    <div style="font-weight:700;color:#0d3b66;margin-bottom:4px;">Ready to send <span id="cnt"></span></div>
    <div id="list"></div>
    <button class="bigbtn send" id="sendBtn" onclick="sendAll()">📤 Send to operator</button>
    <div id="sendMsg" class="muted" style="margin-top:8px;text-align:center;"></div>
  </div>

<script>
var FN='https://xecxfkuzexshafwuuizf.supabase.co/functions/v1/field-capture-submit';
var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlY3hma3V6ZXhzaGFmd3V1aXpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTk1MTIsImV4cCI6MjA5MTMzNTUxMn0.sZrRmesCDn0DsuldUD8zIhi1gX1ajIKX0aULqNBX_To';

// remember the operator email on this phone
try{ document.getElementById('opEmail').value=localStorage.getItem('ooh_field_op')||''; }catch(e){}
document.getElementById('opEmail').addEventListener('change',function(){ try{ localStorage.setItem('ooh_field_op',(this.value||'').trim().toLowerCase()); }catch(e){} });

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

// downscale an image dataURL (keeps uploads small on weak signal)
function downscale(dataURL,max,q){ return new Promise(function(res){ var img=new Image(); img.onload=function(){ var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h||1)); var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',(typeof q==='number'?q:0.6))); }; img.onerror=function(){ res(dataURL); }; img.src=dataURL; }); }
function fileToDataURL(f){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsDataURL(f); }); }
// Re-encode a video smaller (≈640px, low bitrate, WebM) to save cloud storage. Falls back to the
// original if the device can't re-encode (older phones) or if it didn't shrink.
function compressVideo(file, maxPx, bitrate){
  return new Promise(function(res){
    var done=false, url=null, mr=null;
    function finish(x){ if(done) return; done=true; try{clearTimeout(guard);}catch(e){} try{if(url)URL.revokeObjectURL(url);}catch(e){} res(x); }
    // Safety net: if re-encoding stalls (some Android builds), fall back to the original file.
    var guard=setTimeout(function(){ try{ if(mr && mr.state!=='inactive') mr.stop(); }catch(e){} finish(file); }, 25000);
    try{
      if(typeof MediaRecorder==='undefined' || !HTMLCanvasElement.prototype.captureStream){ return finish(file); }
      var v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto';
      url=URL.createObjectURL(file); v.src=url;
      v.onloadedmetadata=function(){
        var w=v.videoWidth||640, h=v.videoHeight||360, s=Math.min(1, maxPx/Math.max(w,h));
        var cw=Math.max(2,Math.round(w*s)), ch=Math.max(2,Math.round(h*s));
        var c=document.createElement('canvas'); c.width=cw; c.height=ch; var ctx=c.getContext('2d');
        var stream=c.captureStream(24);
        var type=(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('video/webm;codecs=vp9'))?'video/webm;codecs=vp9'
                 :((MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('video/webm;codecs=vp8'))?'video/webm;codecs=vp8'
                 :((MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('video/webm'))?'video/webm':''));
        try{ mr = type ? new MediaRecorder(stream,{ mimeType:type, videoBitsPerSecond:(bitrate||350000) }) : new MediaRecorder(stream); }
        catch(e){ return finish(file); }
        var chunks=[];
        mr.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
        mr.onstop=function(){ var out=new Blob(chunks,{type:'video/webm'}); finish(out.size>0 && out.size<file.size ? out : file); };
        var draw=function(){ if(done||v.ended||v.paused) return; ctx.drawImage(v,0,0,cw,ch); requestAnimationFrame(draw); };
        v.onended=function(){ try{ mr.stop(); }catch(e){} };
        v.onplay=function(){ draw(); };
        try{ mr.start(); }catch(e){ return finish(file); }
        v.play().catch(function(){ finish(file); });
      };
      v.onerror=function(){ finish(file); };
    }catch(e){ finish(file); }
  });
}
function grabGPS(){ return new Promise(function(res){ if(!navigator.geolocation){ res(null); return; } navigator.geolocation.getCurrentPosition(function(p){ res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}); }, function(){ res(null); }, {enableHighAccuracy:true,timeout:10000}); }); }

// ---- local queue (IndexedDB) ----
var DB='oohfield', ST='caps';
function idb(){ return new Promise(function(res,rej){ var r=indexedDB.open(DB,1); r.onupgradeneeded=function(){ try{r.result.createObjectStore(ST,{keyPath:'id'});}catch(e){} }; r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
async function qAdd(item){ var db=await idb(); return new Promise(function(res,rej){ var tx=db.transaction(ST,'readwrite'); tx.objectStore(ST).put(item); tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }
async function qAll(){ try{ var db=await idb(); return await new Promise(function(res){ var tx=db.transaction(ST,'readonly'); var rq=tx.objectStore(ST).getAll(); rq.onsuccess=function(){res(rq.result||[]);}; rq.onerror=function(){res([]);}; }); }catch(e){ return []; } }
async function qDel(id){ try{ var db=await idb(); return await new Promise(function(res){ var tx=db.transaction(ST,'readwrite'); tx.objectStore(ST).delete(id); tx.oncomplete=function(){res();}; tx.onerror=function(){res();}; }); }catch(e){} }

async function addCapture(file, isVideo){
  var st=document.getElementById('capStatus');
  st.innerHTML='Reading '+(isVideo?'video':'photo')+' + location…';
  var gps=await grabGPS();
  var item={ id:Date.now()+'-'+Math.random().toString(36).slice(2), captured_at_client:new Date().toISOString(),
    brand:(document.getElementById('brand').value||'').trim(), site_note:(document.getElementById('siteNote').value||'').trim(),
    gps:gps, isVideo:!!isVideo };
  try{
    if(isVideo){
      st.innerHTML='Compressing video… keep the app open.';
      var vclip=await compressVideo(file, 640, 350000);
      if(vclip.size>15*1024*1024){ st.innerHTML='<span class="err">Video is still '+Math.round(vclip.size/1048576)+'MB after compression — record a shorter clip (~5–8s of the loop).</span>'; return; }
      item.video=await fileToDataURL(vclip);
      item.thumb='';   // film emoji shown in the list
    } else {
      var raw=await fileToDataURL(file);
      item.photo=await downscale(raw,1000,0.6);
      item.thumb=item.photo;
    }
  }catch(e){ st.innerHTML='<span class="err">Could not read the file — try again.</span>'; return; }
  await qAdd(item);
  st.innerHTML='<span class="ok">✓ Captured'+(gps?' with location':' — ⚠ no location (turn on GPS/location)')+'. Keep capturing or send below.</span>';
  render();
}
document.getElementById('photoIn').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(f) addCapture(f,false); this.value=''; });
document.getElementById('videoIn').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(f) addCapture(f,true); this.value=''; });

async function render(){
  var items=await qAll(); var card=document.getElementById('listCard'), list=document.getElementById('list');
  document.getElementById('cnt').textContent='('+items.length+')';
  card.style.display=items.length?'block':'none';
  list.innerHTML=items.map(function(it){
    var when=it.captured_at_client?new Date(it.captured_at_client).toLocaleString('en-PH'):'';
    var loc=it.gps?('📍 '+it.gps.lat.toFixed(5)+', '+it.gps.lng.toFixed(5)):'<span class="warn">no location</span>';
    var thumb=it.thumb?('<img src="'+it.thumb+'">'):'<div style="height:54px;width:72px;border-radius:8px;background:#37474f;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">📹</div>';
    return '<div class="cap">'+thumb+'<div class="meta"><strong>'+(it.isVideo?'Video':'Photo')+'</strong>'+(it.brand?(' · '+esc(it.brand)):'')+(it.site_note?(' · '+esc(it.site_note)):'')+'<br>'+esc(when)+'<br>'+loc+'</div>'
      + '<button class="rm" onclick="removeCap(\''+it.id+'\')">×</button></div>';
  }).join('');
}
async function removeCap(id){ await qDel(id); render(); }

async function sendAll(){
  var op=(document.getElementById('opEmail').value||'').trim().toLowerCase();
  var msg=document.getElementById('sendMsg');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(op)){ msg.innerHTML='<span class="err">Enter the operator email first.</span>'; return; }
  try{ localStorage.setItem('ooh_field_op',op); }catch(e){}
  if(!navigator.onLine){ msg.innerHTML='<span class="err">No signal — connect to Wi-Fi/data, then tap Send again. Your captures are safe on this phone.</span>'; return; }
  var items=await qAll(); if(!items.length){ msg.innerHTML='Nothing to send.'; return; }
  var btn=document.getElementById('sendBtn'); btn.disabled=true;
  var sent=0, failed=0;
  for(var i=0;i<items.length;i++){
    var it=items[i];
    msg.innerHTML='⏳ Sending '+(i+1)+' of '+items.length+'… keep this app open.';
    try{
      var payload={ operator_email:op, photo:it.photo||null, video:it.video||null, gps:it.gps||null, captured_at_client:it.captured_at_client, brand:it.brand||null, site_note:it.site_note||null };
      var ctrl=null,to=null; if(typeof AbortController!=='undefined'){ ctrl=new AbortController(); to=setTimeout(function(){try{ctrl.abort();}catch(e){}},120000); }
      var r=await fetch(FN,{ method:'POST', headers:{ apikey:ANON, Authorization:'Bearer '+ANON, 'Content-Type':'application/json' }, body:JSON.stringify(payload), signal:ctrl?ctrl.signal:undefined });
      if(to) clearTimeout(to);
      var b=null; try{ b=await r.json(); }catch(e){ b={}; }
      if(r.ok && !b.error){ await qDel(it.id); sent++; }
      else if(b && b.error==='inbox_full'){ btn.disabled=false; render(); msg.innerHTML='<span class="err">'+esc(b.message||'Operator inbox is full.')+'</span>'; return; }
      else { failed++; }
    }catch(e){ failed++; break; }  // network dropped — stop, keep the rest
  }
  btn.disabled=false; render();
  msg.innerHTML = failed ? ('<span class="warn">Sent '+sent+'. '+failed+' still waiting — tap Send again when signal is better.</span>')
                         : ('<span class="ok">✓ Sent '+sent+' to '+esc(op)+'. The operator will see them in the Ad Verifier.</span>');
}

render();
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
