<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset Password — OOHPhilippines.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1565c0">
<meta name="robots" content="noindex">
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TRKYRLSQHP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-TRKYRLSQHP');
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f4f6f9;color:#1f2933;margin:0;padding:24px;}
  .wrap{max-width:460px;margin:40px auto;}
  .brand{text-align:center;font-size:20px;font-weight:800;color:#0d3b66;margin-bottom:18px;}
  .card{background:#fff;border:1px solid #e0e6ed;border-radius:14px;padding:24px;}
  h1{font-size:20px;margin:0 0 6px;color:#0d3b66;}
  .sub{color:#5b6770;font-size:14px;margin:0 0 18px;line-height:1.5;}
  label{display:block;font-size:13px;font-weight:700;color:#37474f;margin:14px 0 6px;}
  input{width:100%;padding:12px 14px;border:1.5px solid #cfd8e3;border-radius:10px;font-size:15px;font-family:inherit;}
  .btn{display:inline-block;background:#1565c0;color:#fff;border:none;padding:12px 22px;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:18px;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .ghost{display:inline-block;margin-top:14px;color:#1565c0;font-weight:700;text-decoration:none;font-size:14px;}
  .msg{margin-top:14px;font-size:14px;line-height:1.5;}
  .err{color:#b71c1c;}
  .ok{color:#1b5e20;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">OOHPhilippines.com</div>
    <div class="card">
      <h1>🔑 Reset your password</h1>
      <p class="sub" id="sub">Verifying your reset link…</p>

      <div id="formArea" style="display:none;">
        <label for="np">New password</label>
        <input type="password" id="np" placeholder="At least 8 characters" autocomplete="new-password">
        <label for="np2">Confirm new password</label>
        <input type="password" id="np2" placeholder="Re-enter new password" autocomplete="new-password">
        <div><button class="btn" id="saveBtn" onclick="doReset()">Update password</button></div>
      </div>

      <div class="msg" id="msg"></div>
      <div id="backLinks" style="display:none;margin-top:14px;">
        <a class="ghost" href="index.html">← Back to Operator Portal login</a>
        <a class="ghost" href="ad-verifier.html" style="margin-left:16px;">🛡️ Ad Verifier login</a>
      </div>
    </div>
  </div>

<script>
var SUPABASE_URL = 'https://xecxfkuzexshafwuuizf.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlY3hma3V6ZXhzaGFmd3V1aXpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTk1MTIsImV4cCI6MjA5MTMzNTUxMn0.sZrRmesCDn0DsuldUD8zIhi1gX1ajIKX0aULqNBX_To';
var _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
var recoveryReady = false;

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function setSub(t){ document.getElementById('sub').textContent = t; }
function showForm(){ recoveryReady=true; document.getElementById('formArea').style.display='block'; setSub('Choose a new password for your operator account.'); }
function fail(t){
  setSub('');
  document.getElementById('msg').innerHTML='<span class="err">'+esc(t)+'</span>';
  document.getElementById('backLinks').style.display='block';
}

// The recovery link puts a token in the URL; supabase-js exchanges it for a
// temporary session and fires PASSWORD_RECOVERY. Show the form when that happens.
_sb.auth.onAuthStateChange(function(event, session){
  if(event==='PASSWORD_RECOVERY' || (session && !recoveryReady)) showForm();
});

// Fallback: if the session was already established by the time we check.
(async function(){
  try{
    var sess=(await _sb.auth.getSession()).data.session;
    if(sess){ showForm(); return; }
    // Give supabase a moment to process the URL hash, then decide.
    setTimeout(async function(){
      if(recoveryReady) return;
      var s2=(await _sb.auth.getSession()).data.session;
      if(s2) showForm();
      else fail('This reset link is invalid or has expired. Please request a new one from the Ad Verifier login screen (“Forgot password?”).');
    }, 1500);
  }catch(e){
    fail('Something went wrong verifying your link. Please request a new reset link.');
  }
})();

async function doReset(){
  if(!recoveryReady) return;
  var p1=(document.getElementById('np').value||'');
  var p2=(document.getElementById('np2').value||'');
  var msg=document.getElementById('msg');
  if(p1.length<8){ msg.innerHTML='<span class="err">Password must be at least 8 characters.</span>'; return; }
  if(p1!==p2){ msg.innerHTML='<span class="err">The two passwords don\'t match.</span>'; return; }
  var btn=document.getElementById('saveBtn'); btn.disabled=true; msg.innerHTML='⏳ Updating…';
  try{
    var res=await _sb.auth.updateUser({ password:p1 });
    if(res.error){ btn.disabled=false; msg.innerHTML='<span class="err">'+esc(res.error.message||'Could not update password.')+'</span>'; return; }
    document.getElementById('formArea').style.display='none';
    setSub('');
    msg.innerHTML='<span class="ok">✅ Your password has been updated. You can now log in with your new password.</span>';
    document.getElementById('backLinks').style.display='block';
    try{ await _sb.auth.signOut(); }catch(e){}
  }catch(e){ btn.disabled=false; msg.innerHTML='<span class="err">Update failed — please try again.</span>'; }
}
</script>
</body>
</html>
