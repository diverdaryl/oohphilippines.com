function photoUrl(p) {
  if (!p) return '';
  if (String(p).toLowerCase().endsWith('.pdf')) return '';
  if (/^https?:\/\//.test(p)) return p;
  return PHOTO_BASE + encodeURIComponent(p);
}
function coordsOf(r) {
  if (r.lat != null && r.lng != null) return [r.lat, r.lng];
  var u = r.maps_url || '';
  var la = (u.match(/!1d(-?[0-9.]+)/) || [])[1];
  var lo = (u.match(/!2d(-?[0-9.]+)/) || [])[1];
  if (la && lo) return [parseFloat(la), parseFloat(lo)];
  return null;
}
function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

}

// ================= Campaign builder: click sites → live reach + budget =================
var ROWS = {};                 // site_name -> row
var CAMP = [];                 // selected site_names
var RATES = {};                // site_name -> manually entered monthly rate (overrides listed/blank)
try { CAMP = JSON.parse(localStorage.getItem('ooh_camp') || '[]') || []; } catch(e) { CAMP = []; }
try { RATES = JSON.parse(localStorage.getItem('ooh_camp_rates') || '{}') || {}; } catch(e) { RATES = {}; }

// —— Reach model (ported from the main site so numbers are consistent) ——
var OOHPH_CORRIDOR_ADT = [
  { keys:['EDSA'], adt:407342 }, { keys:['COMMONWEALTH'], adt:407988 },
  { keys:['QUEZON AVE'], adt:312486, excludeKeys:['ALBAY','LEGAZPI'] },

  { keys:['CCLEX'], adt:25000 }, { keys:['SCTEX'], adt:45000 },

  { keys:['AURORA BLVD','AURORA BOULEVARD'], adt:70000 },
  { keys:['GIL PUYAT','PUYAT','BUENDIA','AYALA','GLORIETTA','MAKATI AVE','JUPITER'], adt:90000, excludeKeys:['DAVAO'] },
  { keys:['34TH STREET','34TH ST','11TH AVE','7TH AVE','5TH AVE','FORT BONIFACIO','BGC'], adt:40000, excludeKeys:['CEBU'] },
  { keys:['MONUMENTO','CALOOCAN'], adt:90000 },
  { keys:['QUIMPO'], adt:57800 }, { keys:['JP LAUREL','J.P. LAUREL','LANANG','BAJADA'], adt:40000 },
  { keys:['CEBU NORTH ROAD'], adt:49000 }, { keys:['ML QUEZON','M.L. QUEZON'], adt:83000 },
  { keys:['OSMENA BLVD','OSMEÑA BLVD'], adt:58600 }, { keys:['MACTAN CIRCUM'], adt:85000 },
  { keys:['MACARTHUR'], adt:33000, excludeKeys:['DAVAO'] }, { keys:['LIPA'], adt:30000 },
  { keys:['DIVERSION RD','SEN. BENIGNO','MANDURRIAO'], adt:28000, excludeKeys:['DAVAO'] }
];
var OOHPH_CITY_TIERS = [
  { keys:['CEBU'], adt:60000 }, { keys:['DAVAO'], adt:60000 }, { keys:['BACOLOD'], adt:40000 },
  { keys:['ILOILO'], adt:40000 }, { keys:['CAGAYAN DE ORO','CDO'], adt:40000 }, { keys:['BAGUIO'], adt:30000 },
  { keys:['PAMPANGA','TARLAC','NUEVA ECIJA','BULACAN','ANGELES','MABALACAT'], adt:50000 },
  { keys:['CAVITE','LAGUNA','BATANGAS','DASMARIÑAS','DASMARINAS','BACOOR','IMUS','SANTA ROSA','CALAMBA','CABUYAO'], adt:45000 },
  { keys:['ILOCOS','LA UNION','PANGASINAN','CAGAYAN','ISABELA','ZAMBALES','OLONGAPO','SUBIC'], adt:30000 },
  { keys:['CAMARINES','ALBAY','SORSOGON','NAGA','LEGAZPI'], adt:35000 },
  { keys:['BOHOL','NEGROS','CAPIZ','AKLAN','SAMAR','LEYTE','PALAWAN','PUERTO PRINCESA','DUMAGUETE'], adt:35000 },
  { keys:['GENSAN','ZAMBOANGA','AGUSAN','BUTUAN','LANAO','ILIGAN','COTABATO','KORONADAL'], adt:35000 },
  { keys:['MANILA','QUEZON CITY','MAKATI','PASIG','TAGUIG','MANDALUYONG','PARANAQUE','PARAÑAQUE','CALOOCAN','MARIKINA','ANTIPOLO','PASAY','MUNTINLUPA','LAS PINAS','LAS PIÑAS','VALENZUELA','MALABON','NAVOTAS','SAN JUAN','PATEROS'], adt:120000 }
];
var OOHPH_PROVINCIAL_DEFAULT_ADT = 25000, OOHPH_OCCUPANCY = 1.9;
var OOHPH_LTS = { 'Static':0.45, 'LED':0.55, 'LPB':0.35 };
function ooCorridor(location, tag){
  var text = ((location||'')+' '+(tag||'')).toString().toUpperCase();
  for (var i=0;i<OOHPH_CORRIDOR_ADT.length;i++){ var road=OOHPH_CORRIDOR_ADT[i];
    if (road.excludeKeys){ var ex=false; for(var e=0;e<road.excludeKeys.length;e++){ if(text.indexOf(road.excludeKeys[e])!==-1){ex=true;break;} } if(ex) continue; }
    for (var k=0;k<road.keys.length;k++){ if(text.indexOf(road.keys[k])!==-1) return road; }
  }
  return null;
}
function ooCityTier(location, tag){
  var text = ((location||'')+' '+(tag||'')).toString().toUpperCase();
  for (var i=0;i<OOHPH_CITY_TIERS.length;i++){ var t=OOHPH_CITY_TIERS[i]; for(var k=0;k<t.keys.length;k++){ if(text.indexOf(t.keys[k])!==-1) return t; } }
  return { adt: OOHPH_PROVINCIAL_DEFAULT_ADT };
}
function ooDirectionFactor(tag){ var t=(tag||'').toString().toLowerCase(); var d=['northbound','southbound','eastbound','westbound'].filter(function(x){return t.indexOf(x)!==-1;}); return d.length>=2?1.0:0.5; }
function estReachWeekly(r){
  var c = ooCorridor(r.location, r.tag); var adt = c ? c.adt : ooCityTier(r.location, r.tag).adt;
  var lts = OOHPH_LTS[r.type] || OOHPH_LTS['Static'];
  return Math.round(adt * OOHPH_OCCUPANCY * ooDirectionFactor(r.tag) * lts * 7);
}
function rateNum(r){ var s=String((r&&(r.op_rate||r.price))||'').replace(/,/g,''); var m=s.match(/([0-9]+(?:\.[0-9]+)?)/); return m?parseFloat(m[1]):null; }
function fmtK(n){ if(n>=1000000) return (n/1000000).toFixed(1)+'M'; if(n>=1000) return Math.round(n/1000)+'K'; return String(Math.round(n)); }
function peso(n){ return '₱' + Math.round(n).toLocaleString('en-PH'); }

function saveCamp(){ try{ localStorage.setItem('ooh_camp', JSON.stringify(CAMP)); localStorage.setItem('ooh_camp_rates', JSON.stringify(RATES)); }catch(e){} }
function setAddBtn(btn, inCamp){ if(!btn) return; btn.className='pop-add'+(inCamp?' added':''); btn.textContent=inCamp?'✓ In campaign':'➕ Add to campaign'; }
// Effective monthly rate for a site: the planner's typed rate if any, else the operator's listed rate, else null.
function effectiveRate(sn){ if(RATES[sn]!=null && RATES[sn]!=='') { var v=parseFloat(RATES[sn]); return isFinite(v)?v:null; } return rateNum(ROWS[sn]); }
function addToCamp(sn, btn){
  var i=CAMP.indexOf(sn);
  if(i<0){ CAMP.push(sn); setAddBtn(btn, true); } else { CAMP.splice(i,1); delete RATES[sn]; setAddBtn(btn, false); }
  saveCamp(); renderCamp();
}
function removeCamp(sn){ var i=CAMP.indexOf(sn); if(i>=0){ CAMP.splice(i,1); delete RATES[sn]; saveCamp(); renderCamp(); } }
function clearCamp(){ CAMP=[]; RATES={}; saveCamp(); renderCamp(); }
function setRate(sn, val){ if(val==='' || val==null){ delete RATES[sn]; } else { RATES[sn]=val; } saveCamp(); updateTotals(); }
function toggleCamp(){ var inner=document.getElementById('campInner'); var ic=document.getElementById('campCollapse'); if(!inner) return; var hidden=inner.style.display==='none'; inner.style.display=hidden?'block':'none'; if(ic) ic.textContent=hidden?'▾':'▸'; }
function updateTotals(){
  var totalReach=0, budget=0, withRate=0;
  CAMP.forEach(function(sn){ var r=ROWS[sn]; if(r) totalReach+=estReachWeekly(r); var er=effectiveRate(sn); if(er!=null){ budget+=er; withRate++; } });
  var el=document.getElementById('campTotals'); if(!el) return;
  el.innerHTML =
    '👁 <span class="big">~'+fmtK(totalReach)+'</span> estimated weekly views<br>' +
    '💰 <span class="big">'+peso(budget)+'</span>/mo <span class="note">('+withRate+' of '+CAMP.length+' priced)</span><br>' +
    '<span class="note">Type each rate below (operator rates are often not listed). Reach is an estimate.</span>';
}
function renderCamp(){
  var panel=document.getElementById('campPanel'); if(!panel) return;
  document.getElementById('campCount').textContent = CAMP.length;
  if(!CAMP.length){ panel.style.display='none'; return; }
  panel.style.display='block';
  var list=document.getElementById('campList');
  list.innerHTML = CAMP.map(function(sn){
    var r=ROWS[sn]; var nm=r?(r.display_name||r.site_name):sn;
    var er=effectiveRate(sn);
    var val = (RATES[sn]!=null && RATES[sn]!=='') ? RATES[sn] : (rateNum(r)!=null ? rateNum(r) : '');
    return '<div class="crow"><span class="cnm" title="'+esc(nm)+'">'+esc(nm)+'</span>' +
      '<span class="crate-wrap">₱<input class="crate" type="number" min="0" step="1000" inputmode="numeric" placeholder="rate/mo" value="'+val+'" oninput="setRate(\''+String(sn).replace(/'/g,"\\'")+'\', this.value)"></span>' +
      '<button class="cx" onclick="removeCamp(\''+String(sn).replace(/'/g,"\\'")+'\')">×</button></div>';
  }).join('');
  updateTotals();
  if (typeof refreshProposalUI === 'function') refreshProposalUI();
}
function copyCamp(){
  if(!CAMP.length) return;
  var lines=['OOH Philippines — campaign shortlist',''];
  var totalReach=0, budget=0;
  CAMP.forEach(function(sn){ var r=ROWS[sn]; if(!r) return; var er=effectiveRate(sn); if(er!=null) budget+=er; totalReach+=estReachWeekly(r);
    lines.push('• '+(r.display_name||r.site_name)+' ['+r.site_name+'] — '+(r.tag||r.location||'')+(er!=null?('  ·  '+peso(er)+'/mo'):'  ·  (rate TBD)')); });
  lines.push('', 'Sites: '+CAMP.length+'  ·  Est. weekly views: ~'+fmtK(totalReach)+'  ·  Budget: '+peso(budget)+'/mo', 'via oohphilippines.com');
  var text=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ alert('Campaign list copied — paste it into an email or message.'); }, function(){ prompt('Copy your campaign list:', text); }); }
  else { prompt('Copy your campaign list:', text); }
}

// Resolve the signed-in user. The main site has TWO kinds of login:
//  1) Advertiser / admin "free" accounts — NO Supabase Auth session; stored in
//     localStorage under oohph_free_user (custom login_free_user RPC).
//  2) Operator / subscriber accounts — a real Supabase Auth (GoTrue) session.
// Check localStorage first, then fall back to the auth session.
async function resolveUser(){
  try {
    var raw = localStorage.getItem(FREE_USER_KEY);
    if (raw) { var u = JSON.parse(raw); if (u && u.email) return { email: u.email, name: u.name || '', company: u.company || '' }; }
  } catch(e){}
  try {
    var s = await _supabase.auth.getSession();
    var au = s && s.data && s.data.session && s.data.session.user;
    if (au && au.email) {
      var info = { email: au.email, name: (au.user_metadata && au.user_metadata.name) || '', company: '' };
      try { var p = await _supabase.from('profiles').select('name,company').eq('id', au.id).single();
        if (p && p.data) { info.name = p.data.name || info.name; info.company = p.data.company || ''; } } catch(e){}
      return info;
    }
  } catch(e){}
  return null;
}
async function fetchBalance(email){
  try { var r = await _supabase.rpc('get_credits', { p_email: email }); if (!r.error && typeof r.data === 'number') return r.data; } catch(e){}
  return null;
}
// Keep the panel's balance line / button label current.
async function refreshProposalUI(){
  var btn=document.getElementById('campPropBtn'), bal=document.getElementById('campBal');
  if(!btn) return;
  PROPOSAL_USER = await resolveUser();
  if (!PROPOSAL_USER){ btn.textContent='📄 Build Proposal (sign in)'; if(bal) bal.innerHTML='Sign in on the main site to download proposals.'; return; }
  if (isAdminEmail(PROPOSAL_USER.email)){ btn.textContent='📄 Build Proposal'; if(bal) bal.innerHTML='Signed in as admin — proposals are free.'; return; }
  var c = await fetchBalance(PROPOSAL_USER.email);
  PROPOSAL_USER.credits = c;
  btn.textContent='📄 Build Proposal ('+PROPOSAL_COST+' credits)';
  if(bal) bal.innerHTML = (c==null?'':'Your balance: <b>'+c+'</b> credits · uses '+PROPOSAL_COST+' per proposal');
}

async function startProposal(){
  if(!CAMP.length){ return; }
  var btn=document.getElementById('campPropBtn'); if(btn){ btn.disabled=true; }
  PROPOSAL_USER = await resolveUser();
  if(btn){ btn.disabled=false; }
  if(!PROPOSAL_USER){
    propModal('<h3>Sign in to download</h3>'+
      '<p>Building a campaign is free. To generate a branded proposal you need to be signed in. It costs <b>'+PROPOSAL_COST+' credits</b> per proposal.</p>'+
      '<div class="prow"><button class="pb-ghost" onclick="closeProp()">Not now</button>'+
      '<button class="pb-alt" onclick="location.href=\'index.html\'">Go to sign in</button></div>');
    return;
  }
  if(isAdminEmail(PROPOSAL_USER.email)){
    propModal('<h3>Generate proposal</h3>'+
      '<p>Proposal for <b>'+CAMP.length+' site'+(CAMP.length>1?'s':'')+'</b>. Signed in as admin — this is <b>free</b> (no credits used).</p>'+
      '<div class="prow"><button class="pb-ghost" onclick="closeProp()">Cancel</button>'+
      '<button class="pb-primary" id="propGenBtn" onclick="confirmProposal()">Generate</button></div>');
    return;
  }
  var bal = await fetchBalance(PROPOSAL_USER.email);
  PROPOSAL_USER.credits = bal;
  if(bal==null || bal < PROPOSAL_COST){
    propModal('<h3>Not enough credits</h3>'+
      '<p>A proposal costs <b>'+PROPOSAL_COST+' credits</b>. Your balance is <b>'+(bal==null?0:bal)+'</b>. Top up to continue — credits also unlock ROI reports, AI pitches &amp; search.</p>'+
      '<div class="prow"><button class="pb-ghost" onclick="closeProp()">Cancel</button>'+
      '<button class="pb-primary" onclick="location.href=\'pricing.html\'">💎 Buy Credits</button></div>');
    return;
  }
  propModal('<h3>Generate proposal</h3>'+
    '<p>Proposal for <b>'+CAMP.length+' site'+(CAMP.length>1?'s':'')+'</b>. This will use <b>'+PROPOSAL_COST+' credits</b> (you have '+bal+'). You can download both PDF and PowerPoint from one charge.</p>'+
    '<div class="prow"><button class="pb-ghost" onclick="closeProp()">Cancel</button>'+
    '<button class="pb-primary" id="propGenBtn" onclick="confirmProposal()">Use '+PROPOSAL_COST+' credits</button></div>');
}

async function confirmProposal(){
  var gb=document.getElementById('propGenBtn'); if(gb){ gb.disabled=true; gb.textContent='Working…'; }
  var admin = PROPOSAL_USER && isAdminEmail(PROPOSAL_USER.email);
  var newBal = null;
  if(!admin){
    var res;
    try { res = await _supabase.rpc('spend_credits_by_email', { p_email: PROPOSAL_USER.email, p_cost: PROPOSAL_COST }); } catch(e){ res = { error: e }; }
    if(!res || res.error || res.data==null || res.data < 0){
      propModal('<h3>Couldn\'t charge credits</h3>'+
        '<p>We couldn\'t deduct your credits — your balance may have changed. Please try again.</p>'+
        '<div class="prow"><button class="pb-ghost" onclick="closeProp()">Close</button>'+
        '<button class="pb-primary" onclick="startProposal()">Retry</button></div>');
      return;
    }
    newBal = res.data;
    PROPOSAL_USER.credits = newBal;
  }
  refreshProposalUI();
  // Pre-build data + optional assets once, then let them download either format.
  var data = buildProposalData();
  var assets = await loadProposalAssets(data);
  propModal('<h3>✅ Proposal ready</h3>'+
    '<p>'+(admin ? 'Admin — no credits used.' : ('Charged '+PROPOSAL_COST+' credits · balance now <b>'+newBal+'</b>.'))+' Download your proposal:</p>'+
    '<div class="prop-dl"><button class="dl-pdf" onclick="dlPDF()">⬇ PDF</button>'+
    '<button class="dl-ppt" onclick="dlPPTX()">⬇ PowerPoint</button></div>'+
    '<div class="prow" style="margin-top:12px"><button class="pb-ghost" onclick="closeProp()">Done</button></div>');
  window._propData = data; window._propAssets = assets;
}

function buildProposalData(){
  var sites=[], totalReach=0, budget=0, withRate=0;
  CAMP.forEach(function(sn){ var r=ROWS[sn]; if(!r) return;
    var reach=estReachWeekly(r); var er=effectiveRate(sn);
    totalReach+=reach; if(er!=null){ budget+=er; withRate++; }
    sites.push({ name:(r.display_name||r.site_name), loc:(r.tag||r.location||''), type:(r.type||''),
      reach:reach, rate:er, coords:coordsOf(r) });
  });
  return { sites:sites, totalReach:totalReach, budget:budget, withRate:withRate,
    count:sites.length, date:new Date().toLocaleDateString('en-PH',{year:'numeric',month:'long',day:'numeric'}),
    user:PROPOSAL_USER };
}

function imgToDataUrl(url, timeout){
  return new Promise(function(resolve){
    var done=false, t=setTimeout(function(){ if(!done){ done=true; resolve(null);} }, timeout||6000);
    var img=new Image(); img.crossOrigin='anonymous';
    img.onload=function(){ if(done) return; done=true; clearTimeout(t);
      try { var c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
        c.getContext('2d').drawImage(img,0,0); resolve({ url:c.toDataURL('image/png'), w:img.naturalWidth, h:img.naturalHeight }); }
      catch(e){ resolve(null); } };
    img.onerror=function(){ if(done) return; done=true; clearTimeout(t); resolve(null); };
    img.src=url;
  });
}
async function loadProposalAssets(data){
  var a = { logo:null, map:null };
  a.logo = await imgToDataUrl(PHOTO_BASE+'logo.png', 5000);
  var pts = data.sites.map(function(s){ return s.coords; }).filter(Boolean).slice(0,50);
  if (pts.length){
    var markers = pts.map(function(c){ return 'markers=color:0xe65100%7C'+c[0].toFixed(5)+','+c[1].toFixed(5); }).join('&');
    var murl='https://maps.googleapis.com/maps/api/staticmap?size=640x360&scale=2&maptype=roadmap&'+markers+'&key='+STATIC_MAPS_KEY;
    a.map = await imgToDataUrl(murl, 7000);
  }
  return a;
}

function dlPDF(){
  var data=window._propData, assets=window._propAssets||{}; if(!data) return;
  var jsPDF = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : window.jsPDF;
  var doc = new jsPDF({ unit:'pt', format:'a4' });
  var W = doc.internal.pageSize.getWidth(), M=40, y=48;
  // Header band
  doc.setFillColor(21,101,192); doc.rect(0,0,W,96,'F');
  if(assets.logo){ try{ doc.addImage(assets.logo.url,'PNG',M,26,44,44);}catch(e){} }
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text('OOH Campaign Proposal', assets.logo?M+58:M, 50);
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text('OOHPhilippines.com  ·  '+data.date, assets.logo?M+58:M, 70);
  y=128;
  // Prepared-for / by
  doc.setTextColor(60,72,81); doc.setFontSize(11);
  if(data.user){ var who=(data.user.name||data.user.email)+(data.user.company?(' — '+data.user.company):'');
    doc.text('Prepared for: '+who, M, y); y+=18; }
  // Summary
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(21,101,192);
  doc.text('Campaign Summary', M, y); y+=8;
  doc.setDrawColor(230,236,245); doc.line(M,y,W-M,y); y+=20;
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(60,72,81);
  doc.text('Sites: '+data.count, M, y);
  doc.text('Est. weekly views: ~'+fmtK(data.totalReach), M+160, y);
  doc.text('Budget: '+peso(data.budget)+'/mo', M+360, y); y+=14;
  doc.setFontSize(9); doc.setTextColor(144,164,174);
  doc.text('('+data.withRate+' of '+data.count+' sites priced · reach is an estimate from corridor/area traffic models)', M, y+=14);
  y+=10;
  // Map thumbnail
  if(assets.map){ try{ var mw=W-2*M, mh=mw*(assets.map.h/assets.map.w);
    if(mh>220){ mh=220; mw=mh*(assets.map.w/assets.map.h); }
    doc.addImage(assets.map.url,'PNG',M,y,mw,mh); y+=mh+16; }catch(e){} }
  // Site table
  var rows = data.sites.map(function(s){ return [ s.name, s.loc, s.type||'—',
    '~'+fmtK(s.reach), (s.rate!=null?peso(s.rate):'TBD') ]; });
  doc.autoTable({ startY:y, head:[['Site','Location','Type','Wk. views','₱/mo']], body:rows,
    styles:{ fontSize:9, cellPadding:5 }, headStyles:{ fillColor:[21,101,192], textColor:255 },
    alternateRowStyles:{ fillColor:[244,248,254] }, margin:{ left:M, right:M },
    columnStyles:{ 3:{ halign:'right' }, 4:{ halign:'right' } } });
  var fy = doc.lastAutoTable.finalY || y;
  doc.setFontSize(8); doc.setTextColor(144,164,174);
  doc.text('Generated via oohphilippines.com — Philippine out-of-home advertising directory & marketplace.', M, Math.min(fy+24, doc.internal.pageSize.getHeight()-24));
  doc.save('OOH-Proposal-'+Date.now()+'.pdf');
}

// Called by the Google Maps loader once the API is ready.
function initMap(){
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 12.8797, lng: 121.7740 }, zoom: 6,
    mapTypeControl: false, streetViewControl: false, fullscreenControl: true, gestureHandling: 'greedy'
  });
  infoWindow = new google.maps.InfoWindow({ maxWidth: 260 });

  fetch(SUPABASE_URL + '/rest/v1/billboards?select=site_name,display_name,location,tag,type,photo,lat,lng,maps_url,price,op_rate&status=eq.active&limit=6000', {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    var markers = [], bounds = new google.maps.LatLngBounds(), pinned = 0, skipped = 0;
    (rows || []).forEach(function(r){
      var c = coordsOf(r);
      if (!c || isNaN(c[0]) || isNaN(c[1]) || (c[0] === 0 && c[1] === 0)) { skipped++; return; }
      ROWS[r.site_name] = r;             // keep row data for the campaign builder
      var pos = { lat: c[0], lng: c[1] };
      var m = new google.maps.Marker({ position: pos });
      (function(row, coord, mk){ mk.addListener('click', function(){ infoWindow.setContent(popupHtml(row, coord)); infoWindow.open(map, mk); }); })(r, c, m);
      markers.push(m);
      bounds.extend(pos);
      pinned++;
    });
    new markerClusterer.MarkerClusterer({ map: map, markers: markers });
    if (pinned) { try { map.fitBounds(bounds); } catch(e){} }
    document.getElementById('mapInfo').innerHTML = '📍 ' + pinned.toLocaleString() + ' billboard sites' +
      (skipped ? '<small>' + skipped + ' without map coordinates</small>' : '');
    renderCamp();                        // restore any saved campaign now that ROWS are loaded
  })
  .catch(function(){
    document.getElementById('mapInfo').textContent = '❌ Could not load sites. Please refresh.';
  });
}
window.initMap = initMap;
